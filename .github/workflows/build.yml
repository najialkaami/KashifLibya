name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Name the APK with the build number
        run: cp app/build/outputs/apk/debug/app-debug.apk kashif-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kashif-build-${{ github.run_number }}
          path: kashif-build-${{ github.run_number }}.apk
